<div
  class="skill-tile"
  tabindex="0"
  [class.is-flipped]="flipped"
  (click)="toggleFlip()"
  (keydown.enter)="toggleFlip()"
  (keydown.space)="$event.preventDefault(); toggleFlip()">
  <div class="skill-tile-inner">
    <div class="skill-face skill-front">
      <img [src]="skill.LogoURL" [alt]="skill.Name + ' logo'" class="skill-logo">
      <h4>{{ skill.Name }}</h4>
    </div>
    <div class="skill-face skill-back">
      <p class="label">Skill level</p>
      <p class="score">{{ skill.MyLevel }} / {{ skill.TotalLevel }}</p>
      <p class="level">{{ getSkillLevel(skill.MyLevel, skill.TotalLevel) }}</p>
      <div class="meter" aria-hidden="true">
        <span [style.width.%]="(skill.MyLevel / skill.TotalLevel) * 100"></span>
      </div>
    </div>
  </div>
</div>

<div class="full-div about-page">
  <div class="container content-div about-panel">
    <section id="aboutme">
      <div class="section-title">
        <p class="title-text">About Me</p>
      </div>

      <div class="about-grid">
        <div class="pic-content">
          <img [src]="data.SecondaryPicURL" class="pic-img" alt="Sachin Dev Tomar">
        </div>

        <div class="intro-content">
          <h3 class="primary-name-text">Hello! I am {{ data.FullName }}</h3>
          <p class="role-line">{{ data.CurrentRole }}</p>
          <em><p class="plain-text short-intro">{{ data.Intro.Short }}</p></em>

          <div class="info-grid">
            <p class="plain-text">
              <i class="fas fa-chevron-circle-right primary-name-text" aria-hidden="true"></i>
              <strong>Birthday:</strong> {{ data.Intro.DOB.toString() | date }}
            </p>
            <p class="plain-text">
              <i class="fas fa-chevron-circle-right primary-name-text" aria-hidden="true"></i>
              <strong>Degree:</strong> {{ data.Intro.Graduation }}
            </p>
            <p class="plain-text">
              <i class="fas fa-chevron-circle-right primary-name-text" aria-hidden="true"></i>
              <strong>Hometown:</strong> {{ data.Intro.Hometown }}, {{ data.Intro.State }}
            </p>
            <p class="plain-text">
              <i class="fas fa-chevron-circle-right primary-name-text" aria-hidden="true"></i>
              <strong>Email:</strong> {{ data.Intro.EmailId }}
            </p>
          </div>

          <p class="plain-text long-intro">{{ data.Intro.Long }}</p>
        </div>
      </div>

      <div class="tiles-grid">
        <app-number-tile
          *ngFor="let numberTile of data.NumberTiles"
          [numberTile]="numberTile">
        </app-number-tile>
      </div>
    </section>
  </div>
</div>

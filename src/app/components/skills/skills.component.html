<div class="full-div skills-page">
  <div class="container content-div skills-panel">
    <section id="skills">
      <div class="section-title">
        <p class="title-text">Skills</p>
      </div>
      <p class="section-lead">Hover or tap a skill to see proficiency.</p>

      <div class="skills-grid">
        <app-skill-card
          *ngFor="let skill of data.Skills"
          [skill]="skill">
        </app-skill-card>
      </div>
    </section>

    <section id="certifications">
      <div class="section-title">
        <p class="title-text">Certifications</p>
      </div>
      <p class="section-lead">Verified credentials across cloud, data, and development.</p>

      <div class="certs-grid">
        <app-certification-card
          *ngFor="let cert of data.Certifications; let position = index"
          [cert]="cert"
          [position]="position">
        </app-certification-card>
      </div>
    </section>
  </div>
</div>

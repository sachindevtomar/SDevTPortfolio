<a
  class="cert-card"
  [href]="cert.VerificationLink"
  target="_blank"
  rel="noopener"
  [attr.aria-label]="cert.Name + ' verification'">
  <div class="cert-logo-wrap">
    <img [src]="cert.LogoURL" [alt]="cert.Company + ' logo'" class="cert-logo">
  </div>
  <div class="cert-body">
    <h3>{{ cert.Name }}</h3>
    <p class="company">{{ cert.Company }}</p>
    <p class="issued">Issued {{ cert.IssuedDate.toString() | date: 'MMM yyyy' }}</p>
  </div>
</a>

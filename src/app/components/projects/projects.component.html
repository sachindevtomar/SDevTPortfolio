<div class="full-div projects-page">
  <div class="container content-div projects-panel">
    <section id="projects">
      <div class="section-title">
        <p class="title-text">Projects</p>
      </div>
      <p class="section-lead">Selected builds across web and mobile.</p>

      <div class="projects-grid">
        <article class="project-card" *ngFor="let proj of data.Projects">
          <div class="project-top">
            <span class="project-type" [title]="proj.ProjectType">
              <i class="fas" [ngClass]="proj.FontAwesomeClass" aria-hidden="true"></i>
            </span>
            <h3>{{ proj.Title }}</h3>
          </div>

          <p class="project-description">{{ proj.Description }}</p>

          <div class="project-meta">
            <div class="project-links">
              <a *ngIf="proj.RepoLink" [href]="proj.RepoLink" target="_blank" rel="noopener" aria-label="GitHub repository">
                <i class="fab fa-github" aria-hidden="true"></i>
              </a>
              <a *ngIf="proj.HostLink" [href]="proj.HostLink" target="_blank" rel="noopener" aria-label="Live demo">
                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
              </a>
            </div>
            <p class="project-dates">
              {{ proj.StartDate.toString() | date: 'MMM yyyy' }} – {{ proj.EndDate.toString() | date: 'MMM yyyy' }}
            </p>
          </div>

          <div class="tech-tags">
            <span class="tech-tag" *ngFor="let tech of proj.Technologies">{{ tech }}</span>
          </div>
        </article>
      </div>
    </section>
  </div>
</div>
